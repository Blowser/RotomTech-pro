<div class="container py-4">

  <h1 class="mb-4">

    📦 Gestión de Producto

  </h1>

  <form>

    <div class="mb-3">

      <label class="form-label">

        Nombre

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="producto.nombre"
        name="nombre">

    </div>

    <div class="mb-3">

      <label class="form-label">

        Marca

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="producto.marca"
        name="marca">

    </div>

    <div class="mb-3">

      <label class="form-label">

        Descripción

      </label>

      <textarea
        class="form-control"
        rows="4"
        [(ngModel)]="producto.descripcion"
        name="descripcion">
      </textarea>

    </div>

    <div class="row">

      <div class="col-md-3">

        <label class="form-label">

          Precio

        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="producto.precio"
          name="precio">

      </div>

      <div class="col-md-3">

        <label class="form-label">

          Stock

        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="producto.stock"
          name="stock">

      </div>

      <div class="col-md-3">

        <label class="form-label">

          Descuento

        </label>

        <input
          type="number"
          step="0.01"
          class="form-control"
          [(ngModel)]="producto.descuento"
          name="descuento">

      </div>

    </div>

    <div class="row mt-3">

      <div class="col-md-6">

        <label class="form-label">

          Categoría

        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="producto.categoria"
          name="categoria">

      </div>

      <div class="col-md-6">

        <label class="form-label">

          Subcategoría

        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="producto.subcategoria"
          name="subcategoria">

      </div>

    </div>

    <div class="mt-3">

      <label class="form-label">

        URL Imagen

      </label>

      <input
        type="text"
        class="form-control"
        [(ngModel)]="producto.urlImagen"
        name="urlImagen">

    </div>

    <div class="mt-4">

      <button
        type="button"
        class="btn btn-success"
        (click)="guardar()">

        💾 Guardar

      </button>

    </div>

  </form>

</div>
